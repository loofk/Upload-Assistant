name: upload-assistant-v2

services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${UA_POSTGRES_DB:-upload_assistant}
      POSTGRES_USER: ${UA_POSTGRES_USER:-upload_assistant}
      POSTGRES_PASSWORD: ${UA_POSTGRES_PASSWORD:-change-me-before-deployment}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ua-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - ua-net

  upload-assistant:
    image: ghcr.io/loofk/upload-assistant:v2-dev
    build:
      context: .
      dockerfile: Dockerfile.v2
      args:
        VERSION: ${UA_VERSION:-dev}
        COMMIT: ${UA_COMMIT:-unknown}
        BUILT_AT: ${UA_BUILT_AT:-unknown}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      UA_LISTEN_ADDR: 0.0.0.0:8080
      UA_DATABASE_URL: postgres://${UA_POSTGRES_USER:-upload_assistant}:${UA_POSTGRES_PASSWORD:-change-me-before-deployment}@postgres:5432/${UA_POSTGRES_DB:-upload_assistant}?sslmode=disable
      UA_DATA_DIR: /data
      UA_LOG_LEVEL: ${UA_LOG_LEVEL:-info}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${UA_HTTP_PORT:-8080}:8080"
    volumes:
      - ua-data:/data
      - ${UA_DOWNLOADS_HOST_PATH:-./tmp/downloads}:/downloads:rw
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - ua-net

volumes:
  ua-postgres:
  ua-data:

networks:
  ua-net:
    name: ${UA_DOCKER_NETWORK:-upload-assistant-v2}
