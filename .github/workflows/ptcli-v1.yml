name: PTCLI v1 LOCAL_READY

on:
  push:
    branches: [master, codex/new-feature]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  focused-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg mediainfo
      - name: Install focused dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Focused code and contract checks
        run: make check-ptcli PYTHON=python
      - name: Compose validation
        run: docker compose config -q
      - name: Build focused image
        run: docker build -f Dockerfile.ptcli -t upload-assistant:ptcli-ci .
      - name: Container and LOCAL_READY verification
        run: python scripts/verify_ptcli_local_ready.py --image upload-assistant:ptcli-ci --skip-build --level seedbox-handoff --report ptcli-seedbox-handoff-ready.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ptcli-seedbox-handoff-ready
          path: ptcli-seedbox-handoff-ready.json
